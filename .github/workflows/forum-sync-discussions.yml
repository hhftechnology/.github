# Reusable workflow: hhftechnology/.github/.github/workflows/forum-sync-discussions.yml   (NEW in phase 1b)
# Sends GitHub Discussions events to the HHF forum (Discourse Workflows webhook "W15 GitHub discussion sync")
# and, when a new forum topic is created, comments the forum link once on the discussion.
# Lives next to forum-sync.yml (issues) instead of inside it, so the issue sync that is already live
# (statiq, 16 open PRs) keeps working unchanged: a reusable workflow that asks for discussions: write
# would fail to start from callers that only grant issues: write.
# Uses only the built-in GITHUB_TOKEN (shows as github-actions[bot]); comments it writes don't trigger workflows.
# Webhook URL: derived from the existing FORUM_SYNC_URL secret (…/github-issue-sync → …/github-discussion-sync), so no new secret.
name: Forum sync, discussions (reusable)

on:
  workflow_call:
    inputs:
      forum_host:
        description: Only forum links on this host are posted back to GitHub.
        type: string
        default: forum.hhf.technology
    secrets:
      FORUM_SYNC_TOKEN:
        required: true
      FORUM_SYNC_URL:
        required: true

permissions:
  contents: read
  discussions: write

jobs:
  sync:
    # Skip our own bot and anything the forum sync wrote (marker), so forum → GitHub comments never echo back.
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.comment.body, 'hhf-forum-sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build a trimmed payload
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
        run: |
          jq --arg owner "$OWNER" --arg repo "$REPO" --arg event "$EVENT" '{
            event: $event, action: .action, owner: $owner, repo: $repo,
            discussion: {
              number: .discussion.number, node_id: .discussion.node_id, title: .discussion.title,
              body: (.discussion.body // ""), html_url: .discussion.html_url,
              state: .discussion.state, locked: .discussion.locked,
              category: {name: .discussion.category.name, is_answerable: .discussion.category.is_answerable},
              labels: [.discussion.labels[]?.name], answer_html_url: .discussion.answer_html_url,
              user: {login: .discussion.user.login, type: .discussion.user.type}
            },
            comment: (if .comment then {id: .comment.id, node_id: .comment.node_id, body: .comment.body,
                      html_url: .comment.html_url, parent_id: .comment.parent_id,
                      user: {login: .comment.user.login, type: .comment.user.type}} else null end),
            answer: (if .answer then {html_url: .answer.html_url, user: {login: .answer.user.login}} else null end),
            sender: {login: .sender.login, type: .sender.type}
          }' "$GITHUB_EVENT_PATH" > payload.json

      - name: Send to the forum
        id: send
        env:
          FORUM_SYNC_TOKEN: ${{ secrets.FORUM_SYNC_TOKEN }}
          FORUM_SYNC_URL: ${{ secrets.FORUM_SYNC_URL }}
        run: |
          case "$FORUM_SYNC_URL" in
            */github-issue-sync) URL="${FORUM_SYNC_URL%/github-issue-sync}/github-discussion-sync" ;;
            *) echo "::error::FORUM_SYNC_URL must end with /github-issue-sync"; exit 1 ;;
          esac
          code=$(curl -sS -o resp.json -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 \
            -X POST "$URL" \
            -H "Authorization: Bearer $FORUM_SYNC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json) || code=000
          echo "Forum answered HTTP $code"
          jq -c '{ok, status, reason, topic_url}' resp.json 2>/dev/null || true
          if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
            echo "::error::Forum sync failed with HTTP $code"; exit 1
          fi
          echo "status=$(jq -r '.status // ""' resp.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "topic_url=$(jq -r '.topic_url // ""' resp.json 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Link the forum topic on the discussion (once)
        if: >-
          github.event_name == 'discussion' && github.event.action == 'created' &&
          (steps.send.outputs.status == 'created' || steps.send.outputs.status == 'exists') &&
          startsWith(steps.send.outputs.topic_url, format('https://{0}/', inputs.forum_host))
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_URL: ${{ steps.send.outputs.topic_url }}
          NODE_ID: ${{ github.event.discussion.node_id }}
        run: |
          # shellcheck disable=SC2016  # $id / $body are GraphQL variables, not shell ones
          if gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on Discussion { comments(first: 100) { nodes { body } } } } }' \
               -f id="$NODE_ID" --jq '.data.node.comments.nodes[].body' | grep -q 'hhf-forum-sync'; then
            echo "Forum link already posted"; exit 0
          fi
          body="💬 **This discussion is mirrored on the HHF forum:** $TOPIC_URL

          You can reply here or there. Replies are copied between GitHub and the forum.
          <!-- hhf-forum-sync -->"
          # shellcheck disable=SC2016
          gh api graphql -f query='mutation($id: ID!, $body: String!) { addDiscussionComment(input: {discussionId: $id, body: $body}) { comment { url } } }' \
            -f id="$NODE_ID" -f body="$body" --jq '.data.addDiscussionComment.comment.url'
